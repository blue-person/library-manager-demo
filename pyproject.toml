[project]
name = "library-manager-demo"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "S", "UP"]
ignore = ["W191", "E111", "E114", "E117"] # conflict with tab indentation
